<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Sentiment Analyzer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Upload File for Sentiment Analysis</h1>
        <form id="uploadForm" enctype="multipart/form-data" method="post" action="/upload" class="mt-3">
            <div class="form-group">
                <label for="file">Select a file (CSV or PDF):</label>
                <input type="file" id="file" name="file" accept=".csv,.pdf" required class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
        <div id="result" class="mt-5"></div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#uploadForm').on('submit', function (event) {
                event.preventDefault();
                let formData = new FormData(this);

                $.ajax({
                    url: '/upload',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        let resultHtml = '<h2>Analysis Results</h2>';
                        if (Array.isArray(response)) {
                            resultHtml += '<ul class="list-group">';
                            response.forEach(item => {
                                resultHtml += `<li class="list-group-item">
                                    <strong>Review:</strong> ${item.review}<br>
                                    <strong>Sentiment:</strong> Negative: ${item.sentiment.neg}, Neutral: ${item.sentiment.neu}, Positive: ${item.sentiment.pos}
                                </li>`;
                            });
                            resultHtml += '</ul>';
                        } else if (response.error) {
                            resultHtml += `<div class="alert alert-danger">${response.error}</div>`;
                        } else {
                            resultHtml += `<div class="alert alert-info">Sentiment Scores:<br>
                                Negative: ${response.neg}<br>
                                Neutral: ${response.neu}<br>
                                Positive: ${response.pos}</div>`;
                        }
                        $('#result').html(resultHtml);
                    },
                    error: function () {
                        $('#result').html('<div class="alert alert-danger">An error occurred while processing the file.</div>');
                    }
                });
            });
        });
    </script>
</body>
</html>
